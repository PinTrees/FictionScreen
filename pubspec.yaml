name: fiction_screen
description: "FictionScreen - Fake & Mock Screen Generator for Creators"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  intl: ^0.20.2
  screenshot: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  web: ^1.1.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.6.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/macos/
    - assets/images/macos/golden_gate/
    - assets/images/windows/
    - assets/images/windows/settings/
    - assets/images/ios/
    - assets/images/ios/wallpapers/
    - assets/images/ios/icons/
    - assets/images/ios/icons26/
    - assets/images/galaxy/
    - assets/images/galaxy/wallpapers/
    - assets/images/galaxy/icons/
