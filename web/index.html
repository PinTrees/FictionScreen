<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121217">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="FictionScreen - 영상, 숏폼, 웹툰 창작자를 위한 고품질 가짜 화면(Mock UI) 및 애니메이션 생성기">
  <meta name="keywords" content="카톡 캡처, 가짜 카톡, 유튜브 화면 생성, 인스타 모의 화면, 윈도우 블루스크린, 배달앱 모의화면, Fiction Screen">
  <meta name="author" content="FictionScreen">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="FictionScreen | 가짜 화면 & 애니메이션 생성기">
  <meta property="og:description" content="카카오톡, 인스타그램, 유튜브, 배달앱, 블루스크린 등 창작에 필요한 모든 가짜 화면을 1초 만에 제작하세요.">

  <!-- Pretendard WebFont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FictionScreen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FictionScreen | Fake Mock Screen Studio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google tag (gtag.js) for Firebase Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5ZDNWM16S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Q5ZDNWM16S');
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    body {
      background-color: #0f1015;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 15px;
      font-weight: 500;
      color: #9ca3af;
      letter-spacing: -0.3px;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">FictionScreen 스튜디오 로딩 중...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 앱이 로드되면 로딩 인디케이터를 매끄럽게 제거합니다.
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      }
    });
    // 폴백: 첫 프레임 이벤트 미수신 시에도 3초 후 안전 제거
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('loading-container');
        if (loader) {
          loader.style.transition = 'opacity 0.3s ease';
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 300);
        }
      }, 2000);
    });
  </script>
</body>
</html>
