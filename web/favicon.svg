<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141624" />
      <stop offset="100%" stop-color="#0B0D16" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Front Screen Body Gradient -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="frontShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="-4" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)" filter="url(#squircleShadow)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 2. Ambient Glow inside squircle -->
  <circle cx="160" cy="140" r="140" fill="#6366F1" opacity="0.18" filter="blur(30px)" />
  <circle cx="360" cy="360" r="120" fill="#06B6D4" opacity="0.12" filter="blur(25px)" />

  <!-- 3. Rear Offset Mock Screen -->
  <g transform="translate(180, 110)">
    <rect x="0" y="0" width="220" height="260" rx="40" fill="#0EA5E9" fill-opacity="0.15" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.7" />
    <!-- Rear Screen Mini Header -->
    <rect x="35" y="30" width="150" height="18" rx="9" fill="#38BDF8" fill-opacity="0.4" />
    <rect x="35" y="62" width="100" height="12" rx="6" fill="#38BDF8" fill-opacity="0.25" />
  </g>

  <!-- 4. Front Main Mock Screen -->
  <g transform="translate(112, 142)" filter="url(#frontShadow)">
    <!-- Screen Body -->
    <rect x="0" y="0" width="220" height="260" rx="40" fill="url(#frontGrad)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35" />

    <!-- Gloss Sheen -->
    <path d="M 0,40 A 40,40 0 0 1 40,0 L 180,0 A 40,40 0 0 1 220,40 L 220,110 L 0,110 Z" fill="url(#glossGrad)" />

    <!-- Stylized 'F' & UI Cards Symbol -->
    <g filter="url(#symbolGlow)">
      <!-- Left Spine -->
      <rect x="42" y="44" width="34" height="172" rx="15" fill="#FFFFFF" />

      <!-- Top Header Bar -->
      <rect x="42" y="44" width="136" height="34" rx="15" fill="#FFFFFF" />

      <!-- Middle Floating Card -->
      <rect x="42" y="112" width="104" height="34" rx="15" fill="#FFFFFF" />

      <!-- Bottom Status Indicator Dot -->
      <circle cx="160" cy="200" r="14" fill="#38BDF8" />
    </g>
  </g>
</svg>
